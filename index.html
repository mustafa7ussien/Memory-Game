<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory Scramble</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── BACKGROUND EFFECTS ── -->
  <div id="stars"></div>
  <div id="grid-overlay"></div>

  <!-- ── HEADER ── -->
  <header>
    <div class="game-title">Memory Scramble Game</div>
    
  </header>
  

  <main>

    <!-- ── SETUP PANEL ── -->
    <div id="setup-panel">
      <div class="panel-title">CONFIGURATION</div>
      <div class="config-grid">
        <div class="config-field">
          <label>Rows</label>
          <input type="number" id="cfg-rows" value="4" min="2" max="8"/>
        </div>
        <div class="config-field">
          <label>Columns</label>
          <input type="number" id="cfg-cols" value="4" min="2" max="8"/>
        </div>
        <div class="config-field config-full">
          <label>Time Limit (seconds)</label>
          <input type="number" id="cfg-time" value="60" min="10" max="600"/>
        </div>
      </div>
      <button class="btn-start" id="btn-start"> Play</button>
      <button class="team-btn" id="team-btn">
  
</button>
      
      <div class="error-msg" id="error-msg"></div>
    </div>

      <!-- ── HUD (shown during gameplay) ── -->
    <div id="game-hud">
      <div class="hud-block" id="timer-block">
        <div class="hud-label">Time</div>
        <div class="hud-value" id="hud-timer">00:00</div>
      </div>
      <div class="hud-block">
        <div class="hud-label">Pairs</div>
        <div class="hud-value" id="hud-pairs">0/0</div>
      </div>
      <div class="hud-block">
        <div class="hud-label">Moves</div>
        <div class="hud-value" id="hud-moves">0</div>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <button class="btn-back" id="btn-back"> SETUP</button>
    </div>


  </main>

  <!-- ── END-GAME OVERLAY ── -->
  <div id="overlay">
    <div class="overlay-box">
      <div class="overlay-icon" id="ov-icon"></div>
      <div class="overlay-title" id="ov-title"></div>
      <div class="overlay-stats" id="ov-stats"></div>
      <div>
        <button class="btn-play-again" id="btn-again">▶ PLAY AGAIN</button>
        <button class="btn-setup" id="btn-ov-setup">⚙ SETUP</button>
      </div>
    </div>
  </div>

  <!-- ── TEAM PAGE ── -->
  <div id="team-page">
  
    <div class="team-box">
  
      <h2>TEAM MEMBERS</h2>
  
      <ul>
        <li>Moustafa Hussien</li>
        <li>Manal Taha </li>
        <li>Ahmed Abdelkarim</li>
  
      </ul>
  
      <button id="close-team">
        BACK
      </button>
  
    </div>
  
  </div>
 
  <!-- ── SCRIPTS ── -->
  <script src="javascript/script.js"></script>




</body>
</html>
