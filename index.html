<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory Scramble</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── BACKGROUND EFFECTS ── -->
  <div id="stars"></div>
  <div id="grid-overlay"></div>

  <!-- ── HEADER ── -->
  <header>
    <div class="game-title">Memory Scramble Game</div>
    
  </header>
  

  <main>

    <!-- ── SETUP PANEL ── -->
    <div id="setup-panel">
      <div class="panel-title">CONFIGURATION</div>
      <div class="config-grid">
        <div class="config-field">
          <label>Rows</label>
          <input type="number" id="cfg-rows" value="4" min="2" max="8"/>
        </div>
        <div class="config-field">
          <label>Columns</label>
          <input type="number" id="cfg-cols" value="4" min="2" max="8"/>
        </div>
        <div class="config-field config-full">
          <label>Time Limit (seconds)</label>
          <input type="number" id="cfg-time" value="60" min="10" max="600"/>
        </div>
      </div>
      <button class="btn-start" id="btn-start"> Play</button>
      <button class="team-btn" id="team-btn">
  
</button>
      
      <div class="error-msg" id="error-msg"></div>
    </div>


  </main>
 
  <!-- ── SCRIPTS ── -->
  <script src="javascript/script.js"></script>




</body>
</html>
